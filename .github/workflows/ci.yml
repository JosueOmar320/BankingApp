name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BankingApp.sln

      - name: Check formatting
        run: dotnet format BankingApp.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build BankingApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BankingApp.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Audit NuGet vulnerabilities
        run: |
          dotnet list BankingApp.sln package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
