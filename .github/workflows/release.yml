name: Release

# Pushing a tag such as v1.0.0 builds the Docker image, publishes it to GitHub Container Registry
# and creates the GitHub Release with the notes for that version taken from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to ghcr.io

env:
  IMAGE: ghcr.io/josueomar320/bankingapp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches Directory.Build.props
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "<Version>${VERSION}</Version>" Directory.Build.props; then
            echo "::error::Tag v${VERSION} does not match <Version> in Directory.Build.props:"
            grep "<Version>" Directory.Build.props || true
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything between the "## [x.y.z]" heading and the next heading (or the link references), trimmed.
          awk -v version="$VERSION" '
            /^## \[/ { printing = (index($0, "## [" version "]") == 1); next }
            /^\[[^]]+\]: / { printing = 0 }
            printing { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version ${VERSION}"
            exit 1
          fi
          # Resolve the link references defined at the end of the changelog, since the body is published alone.
          { echo; grep -E '^\[[^]]+\]: ' CHANGELOG.md; } >> release-notes.md
          echo "Release notes:"; cat release-notes.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=BankingApp
            org.opencontainers.image.description=Banking API built with .NET 10, ASP.NET Core and EF Core on SQLite
            org.opencontainers.image.licenses=MIT

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
