services:
  api:
    build: .
    image: bankingapp-api
    container_name: bankingapp-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Data Source=/data/banking.db"
      Database__SeedSampleData: ${SEED_SAMPLE_DATA:-true}
      # Development-only default; the API refuses it outside Development, so set JWT_SIGNING_KEY for Production.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-DEVELOPMENT-ONLY-signing-key-never-use-outside-local-development-0123456789}
    volumes:
      - banking-data:/data
    restart: unless-stopped

volumes:
  banking-data:
