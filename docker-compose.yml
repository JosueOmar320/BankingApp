services:
  api:
    build: .
    image: bankingapp-api
    container_name: bankingapp-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Data Source=/data/banking.db"
      Database__SeedSampleData: ${SEED_SAMPLE_DATA:-true}
    volumes:
      - banking-data:/data
    restart: unless-stopped

volumes:
  banking-data:
